; ==========================================================================================
; VRCAM CPU TWEAKS v2 - desktop - SIMULTANEOUS TRUE-STEREO (main + vrcam)
; ------------------------------------------------------------------------------------------
; Built by walking the FULL GameOptions dump (1525 options). The two-view render doubles the
; render-submission CPU; this file recovers CPU by throttling WORLD-SIMULATION cadence only.
; World sim is a global singleton = one pass shared by BOTH eyes.
;
; RULE: every ACTIVE line changes only how OFTEN invisible/offscreen/distant work runs -
; never a rendered pixel. Anything that would cut visible range/detail (streaming distance,
; LOD, decals, shadow batches, LateVSAlloc, RT, denoiser) is LEFT AT DEFAULT on purpose and
; annotated "KEPT" so you can see it was reviewed, not missed.
;
; Install: ...\Cyberpunk 2077\engine\config\platform\pc\vrcam_cpu_tweaks.ini   (delete=revert)
; Verify each PART with the overlay CPU-profile (frame ms / dispatch main / dispatch vrcam).
; ==========================================================================================


; ============================ NPC AI - tick cadence (dump 1-16) ===========================
[AI]
CodeTweakActionsEnabled = true							; Enables AI code path optimizations for better NPC behavior consistency.
EnableLowFPSDetection = false							; Disables auto-scaling during FPS dips to prevent NPC pop-in glitches.
LOD0BucketSize = 8										; Reduced from desktop version (10) - Closest NPCs group size, lighter CPU load for handhelds.
LOD0TickRate = 1										; Updates every frame - nearby AI remains fully responsive.
LOD1BucketSize = 24										; Reduced from desktop version (32) - Mid-distance AI group size, balanced for mobile CPUs.
LOD1TickRate = 4										; Same as desktop version - reduced tick rate for mid-range AI.
LOD2BucketSize = 24										; Reduced from desktop version (48) - Distant AI group, optimized for 4-8 core mobile CPUs.
LOD2TickRate = 16										; Slower than desktop version (14) - Less frequent updates for far NPCs saves CPU.
LOD3TickRate = 28										; Slower than desktop version (24) - Lowest priority NPCs tick even less often.
LODUpdatePeriod = 2.000000								; Higher than desktop version (1.5) - Reduces CPU load from LOD group reshuffling.

; ====================== NPC AI perception (dump 738-740, 753-755) ==========================
[GameSenses]
SensorsToUpdateLimit = 45               ; def 60 -> fewer AI sensors/frame (distant awareness only).
RayTestsPerThreadLimit = 16             ; def 20 -> fewer perception ray tests/frame.
; InfluenceMap KEPT (gameplay pathing).

; =========================== Combat line-of-sight (dump 797-821) ===========================
[LoSFinderSystem]
TargetOperationsPerFrame = 1            ; KEPT (already minimal).
SeekersOperationsPerFrame = 1           ; KEPT.
MaxRaysNumber = 10                      ; def 12 -> fewer LoS rays/target (combat CPU).
AvoidTracesNumber = 11                  ; def 13 -> fewer avoidance traces.
; Ray lengths KEPT -> AI sight range unchanged.

; ========================= NPC reactions - throttled (dump 1099-1105) ======================
[ReactionSystem]
FramesPerUpdateDeadBodies = 48          ; def 33 -> re-check corpses less often (static anyway).
FramesPerUpdateRespawning = 128         ; def 95 -> slower community respawn poll.
FramesPerUpdateDespawning = 20          ; def 14 -> slower despawn poll.
; FramesPerUpdateFearSourceState KEPT (combat responsiveness).

; ============================== Crowd - cull unseen (dump 64-77) ===========================
[Crowd]
MinStreamingVelocityNormalizedToBlockSpawn = 20.000000	; Higher than desktop version (15) - Reduces NPC spawning during fast movement, critical for streaming stability on shared VRAM.
ZCutoff = 15                                            ; (Decreased, default 20) Helps the CPU ignore NPCs on floors far above or below the player without affecting visible density or breaking quests.
ZCutoffEnabled = true									; Enables Z-axis culling for better performance in vertical environments.

; SpawnLimit / EnablePedestrians / EnableVehicles / UseFrustum KEPT -> crowd DENSITY unchanged.

; ====================== Crowd pathfinding - cheaper (dump 78-137) ==========================
[CrowdMovement]
FearSpreadRadius = 5.000000             ; def 10 -> smaller panic propagation (combat spike).
LaneLightsRecognitionDistance = 15.000000 ; def 25 -> fewer NPCs tracking traffic lights.
MaxDirectionChangeAttempts = 3          ; def 4 -> pathfind reroute cap.
MaxResumeMoveAttempts = 6               ; def 10 -> fewer resume attempts on block.
MaxChancesToUseZebra = 3                ; def 4 -> fewer crossing recalcs.
EnableDirectionSmoothing = true         ; KEPT true -> smooth NPC turning (this IS visible).
EnableDirectionPostProcess = false      ; KEPT false (default).

; ============================== Crowd workspots (dump 138-145) =============================
[Crowds]
EnterWorkspotDelay = 25.000000							; Higher than desktop version (20) - Extends NPC decision timer for workspot interactions, reduces CPU state transition spikes.


; ============================ Animation - distance budget (dump 27-38) =====================
[Animation]
FacialBugettingMinimalDistance = 35.000000  ; def 50 -> budget facial anim from 35m (indistinct).
DistanceToCameraForAlwaysSample = 40.000000 ; def 50 -> always-sample radius (distant frame-skip).
IKTurnOffDistance = 10.000000           ; def 12 -> disable NPC IK 2m sooner (feet unresolvable far).
UseAnimSetupCaching = true              ; KEPT (caching saves CPU).
; MaxFacialAnimationsVisible=3 + facial-angle gates KEPT -> nearby faces full quality.

[Facial]
ResourceBudget = 14                     ; KEPT (lowering drops facial anims on mid NPCs = visible).

; ============================ Particles - offscreen (dump 1174-1176) =======================
[Rendering/Particles]
MaxOffscreenSimTime = 0.800000          ; def 2.0   -> cap OFFSCREEN emitter sim.
MaxNoRenderSimTime = 8.000000           ; def 100.0 -> cap non-rendered emitter sim.
OffscreenUpdateFrequency = 4            ; def 3 -> offscreen particles update every 4th frame.

; ========================= Streaming I/O threads (dump 1264-1267) ==========================
[ResourceLoaderThrottler]
DedicatedDecompressionMemoryBytes = 16777216  ; def 1MB -> 16MB, fewer decompression stalls.
FloodMinNonLoadingThreads = 1           ; def 2 -> lowest streaming-thread contention =
StreamMaxLoadingThreads = 1             ; def 2    best frame-pacing. Back to 2 if pop-in.
TrickleMaxLoadingThreads = 1            ; def 1

; ===================== GPU async compute - keep offloaded (dump 1111-1121) =================
[Rendering/AsyncCompute]
Enable = true
BuildDepthChain = true
DPL = true
DynamicTexture = true
ExposureScaleBuffer = true
ExtendedDuringSSR = true
FlattenNormals = true
LutGeneration = true
RaytraceASBuild = true                  ; keep RT accel build async (you run RT).
SSAO = true
HairClears = false                      ; avoid hair flicker + VR-mod safe.

[Editor/Streaming]
ForceAutoHideDistanceMax = 12500.000000 				; Balanced at 10x1024. Aligned with Handheld's streaming limit to ensure a lean memory footprint on shared VRAM systems.


[LevelOfDetail]
DecalsHideDistance = 25.000000							; Lower than desktop version (35) - Earlier decal culling for GPU performance.
DynamicDecalsHideDistance = 15.000000					; Lower than desktop version (25) - Keeps dynamic decals visible shorter for performance.


[Rendering]
LightRadiusWarningTreshold = 20.000000					; Dev/debug setting (same as default).
MaxGbufferSplits = 4									; Same as desktop version - Balanced bandwidth usage.
RainMapBatchMaxSize = 125								; (150) - Reduced GPU load during storms, critical for integrated graphics.
RainMapBatchMaxTrianglesPerBatch = 75000				; (100k) - Limits rain mesh rendering overhead.
DistantShadowsMaxBatchSize = 200						; (250) - Fewer shadow batches per frame for GPU efficiency.
DistantShadowsMaxTrianglesPerBatch = 200000				; (250k) - Reduces distant shadow overhead significantly.

[Rendering/LateVSAlloc]
Grass = 16												; Reduced from desktop version (28) - Good grass detail without excessive GPU load.
Hair = 20												; Reduced from desktop version (28) - Balanced hair detail for close-ups.
Particles = 20											; Reduced from desktop version (28) - Lighter particle effects for integrated GPU.
Terrain = 8												; Reduced from desktop version (0) - Conservative terrain allocation for shared VRAM.
Trees = 40												; Reduced from desktop version (50) - Optimized tree rendering for open world.

[Streaming]
DistanceBoost = 0.000000 								; Same as default - Ensures stability, as values higher than 0.0 break mesh-to-proxy transitions, causing visual flickering/holes.
MaxStreamingDistance = 10000.000000						; Lower than desktop version - Aggressive culling for VRAM conservation, suitable for 720p-1080p screens.
MaxStreamingObserverHeight = 3.000000					; Default - Adequate for handheld play (less aerial vehicle usage).
MinStreamingDistance = 1.000000							; 	Default 1
StreamingEnabled = true									; Ensures streaming system is active.
MaxNodesPerFrame = 384									; Increased (+28%) over CDPR default (300) - better initial loading stability for handhelds, 64-byte aligned.
EditorThrottledMaxNodesPerFrame = 512					; Increased over CDPR default (500) - binary aligned (2^9). Smooth background streaming without VRAM spikes.
PrecacheDistance = 0.0									; Default dynamic behavior - Works well with fast NVMe storage in handhelds.
MaxNodesPerFrameWHileLoading = 65536					; Aligned with 2^16 - High and safe limit for fast loading (mobile NVMe can handle this) without 999k+ instability.
TimeLimitAttachingPerFrame = 0.350000 					; Lower than default (0.5) - Tuned specifically for handheld CPUs to avoid spikes while improving streaming responsiveness.
TimeLimitSectorLoadPerFrame = 1.200000					; Lower than default (2.0) - Balanced to avoid heavy CPU bursts on low-power devices like Steam Deck / Ally.
TimeLimitSectorUnloadPerFrame = 0.800000 				; Slightly lower than default (1.0) - Ensures old sectors are unloaded at a steady rate, preventing memory buildup and VRAM pressure.
TimeLimitStreamedPerFrame = 6.500000 					; Slightly above default (6.0) - Balanced for handheld bandwidth and CPU limits, reducing pop-in without overwhelming the system.
TimeLimitStreamedPerFrameWhileLoading = 12.000000 		; Increased from default (8.0) - Speeds up loading screens and initial area streaming; No impact on gameplay performance.
ObserverVelocityOffsetEnabled = false					; Default - Disables unnecessary velocity calculations.
ObserverMaxOnFootForwardVelocity = 5.000000				; Default - Responsive on-foot movement.
ObserverMaxNonAirVehicleForwardVelocity = 20.000000		; Default - Smooth vehicle movement.
ObserverMaxAirVehicleForwardVelocity = 0.000000			; Default - Disables air vehicle calculations.

[Streaming/Culling]
Enabled = true											; Activates culling system for performance.
OnlyIfSingleObserver = false								; Default - Optimizes for single player.
StreamingQueryRoadDataMaxNN = 0							; Disables road query overhead for CPU efficiency.
VisibilityQuery = true									; Enables visibility-based culling.
VisibilityQueryActivationDistanceBoost = 25.0			; Reduced from desktop value (35) - More aggressive visibility culling for VRAM conservation and keeps CPU cost low for handheld devices.
Strict = false											; Non-strict culling avoids excessive pop-in.


[Streaming/Editor]
TimeLimitAttachingPerFrame = 15.000000 					; Increased to 15.0 - Gives the engine more time to attach assets, reducing visible pop-in (default is 10.0).
TimeLimitDetachingPerFrame = 10.000000 					; Kept at 10.0 - Detaching is less critical for pop-in, but keeps memory clean.
TimeLimitStreamedPerFrame = 20.000000 					; Raised to 20.0 - Gives a larger time budget for streaming data from disk per frame, ensuring assets load faster during high-speed travel (default is 12.0).

[TargetTracking]
VariableTickRateEnabled = true							; Default - Dynamic CPU cycle saving.


[Occlusion]
ForceFullTest = false
MultiFrustumOcclusionMode = 1
MultiFrustumUseGlobalOcclusion = true
TestPhasesCount = 3