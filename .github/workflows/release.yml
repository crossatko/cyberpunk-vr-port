# Build the plugins on Windows and publish the COMPLETE mod package as a GitHub Release.
#
# Triggered by pushing a tag (v*). Packaging is done by the project's own scripts/build_dist.ps1
# rather than a layout invented here, so a release matches what the maintainers hand testers:
# both plugins, the sight shaders, CET mods, redscript, tweaks, archives, grip poses and the
# README. Built in CI, so a download corresponds exactly to the tagged commit.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for the package name'
        required: false
        default: '0.0.0-dev'

permissions:
  contents: write   # required to create the release

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Derive version from the tag
        id: ver
        shell: bash
        # build_dist.ps1 names the package CyberpunkVRPort-<version>; strip the leading v.
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "packaging version $v"

      - name: Build Stereo
        # build_dist.ps1 looks for build\bin\red4ext\plugins\CyberpunkVR_Stereo\Release\, so the
        # build directory and configuration below are what it expects, not arbitrary choices.
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Build Hands
        # Likewise: the script expects src\red4ext_plugin\build\RelWithDebInfo\.
        run: |
          cmake -B src/red4ext_plugin/build -S src/red4ext_plugin
          cmake --build src/red4ext_plugin/build --config RelWithDebInfo

      - name: Package with the project's own dist script
        shell: pwsh
        run: pwsh scripts/build_dist.ps1 -Version "${{ steps.ver.outputs.version }}" -Zip

      - name: Show what is in the package
        shell: pwsh
        run: |
          $zip = "dist/CyberpunkVRPort-${{ steps.ver.outputs.version }}.zip"
          if (-not (Test-Path $zip)) { throw "package not produced: $zip" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $a = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          $a.Entries | Select-Object FullName,Length | Format-Table -AutoSize
          "{0} entries, {1:N0} bytes" -f $a.Entries.Count, (Get-Item $zip).Length
          $a.Dispose()

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CyberpunkVRPort-${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
          body: |
            Complete CyberpunkVRPort package built by CI from the tagged commit, with the
            Linux/Proton fixes in this fork. For Cyberpunk 2077 **2.31**.

            ## Install
            Unzip into your Cyberpunk 2077 folder (the one with `bin\x64\Cyberpunk2077.exe`).
            The archive is already laid out for it.

            ## You still need the frameworks
            Not redistributed here, install them first if you do not have them:
            [RED4ext](https://github.com/WopsS/RED4ext),
            [Cyber Engine Tweaks](https://github.com/maximegmd/CyberEngineTweaks),
            [redscript](https://github.com/jac3km4/redscript),
            [ArchiveXL](https://github.com/psiberx/cp2077-archive-xl),
            [TweakXL](https://github.com/psiberx/cp2077-tweak-xl),
            [Codeware](https://github.com/psiberx/cp2077-codeware).

            ## Read INSTALL/README in the zip before first launch
            On first start the mod **replaces** your `UserSettings.json` with the settings it was
            tuned against, keeping a timestamped backup. Set `first_launch=1` in
            `bin\x64\vrport.ini` beforehand to skip that.

            Upstream project by [dariulone](https://github.com/dariulone/cyberpunk-vr-port),
            this fork based on [iPowerTech](https://github.com/iPowerTech/cyberpunk-vr-port). MIT.
